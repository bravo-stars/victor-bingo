<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Victor Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #f5c542; }
    .card {
      background: #1d2b40;
      padding: 20px;
      border-radius: 16px;
      margin: 20px auto;
      max-width: 420px;
    }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #f5c542;
      color: #101827;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎉 VICTOR BINGO</h1>

  <div class="card">
    <h2>Welcome to Victor Bingo!</h2>
    <p>Play Bingo and enjoy the game.</p>
    <button onclick="startGame()">🎮 PLAY BINGO</button>
    <p id="status">Waiting to start...</p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function startGame() {
      document.getElementById("status").textContent =
        "Victor Bingo is getting ready!";
    }
  </script>
</body>
</html>
